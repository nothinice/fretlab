<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FretLab — интерактивный урок</title>
<style>
:root{color-scheme:dark;--bg:#171310;--panel:#241e19;--ink:#f3eee3;--muted:#a99e90;--gold:#f2c14e;--teal:#58a99c;--coral:#ec765e;--ivory:#fff5df;--line:#493d33}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#302318 0,transparent 35rem),var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif}button{font:inherit}.app{max-width:1450px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.brand{font-weight:950;font-size:20px;letter-spacing:.06em}.brand b{color:var(--gold)}.actions,.nav,.tools{display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:10px;background:#302821;color:var(--ink);padding:10px 14px;font-weight:800;cursor:pointer}.btn.primary,.btn.active{background:var(--gold);border-color:var(--gold);color:#211a13}.timeline{display:grid;grid-template-columns:repeat(9,minmax(135px,1fr));gap:8px;margin-bottom:16px;overflow:auto;padding-bottom:5px}.tab{border:1px solid var(--line);border-radius:12px;background:#201b17;color:var(--muted);padding:10px;text-align:left;cursor:pointer}.tab.active{border-color:var(--gold);color:var(--ink);background:#30291c}.tab b{display:block}.tab small{font-size:11px}.grid{display:grid;grid-template-columns:370px minmax(0,1fr);gap:17px}.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 22px 60px #0006}.script-card{padding:24px;display:flex;flex-direction:column}.kicker{color:var(--teal);font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}h1{font-size:42px;line-height:1.02;letter-spacing:-.04em;margin:8px 0 18px}.script{padding:17px;border-left:4px solid var(--gold);border-radius:0 12px 12px 0;background:#181411;font-size:18px}.script small{display:block;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.key{padding:13px;border:1px solid #41655e;border-radius:12px;color:#b8e1da;background:#22312d}.nav{margin-top:auto}.nav .btn{flex:1}.lab{min-width:0;padding:20px}.lab-head{display:flex;justify-content:space-between;gap:14px}.lab h2{margin:0;font-size:24px}.lab p{margin:4px 0 14px;color:var(--muted)}.readout{display:flex;gap:6px}.readout span{min-width:66px;padding:6px;border:1px solid var(--line);border-radius:9px;text-align:center;color:var(--gold);font-size:18px;font-weight:900}.readout small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.concept{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:#191512}.concept div{text-align:center}.concept strong{display:block;color:var(--gold);font-size:22px}.concept span{color:var(--muted);font-size:12px}.formula{display:flex;align-items:center;gap:6px;overflow:auto;padding:5px 0 13px}.f-note{flex:0 0 54px;text-align:center}.f-note button{width:43px;height:43px;border:0;border-radius:50%;background:var(--ivory);color:#211a13;font-weight:950}.f-note button.root{background:var(--gold);outline:2px solid white}.f-note small{display:block;color:var(--muted)}.step{flex:0 0 32px;color:var(--teal);font-size:11px;font-weight:900;text-align:center}.step:after{content:'→';display:block;color:#75685c;font-size:18px}.scroll{overflow:auto;border:1px solid #695443;border-radius:14px}.board{position:relative;width:1100px;padding-top:36px;background:linear-gradient(90deg,#44291b,#9a633c 48%,#523220);overflow:hidden}.nums{position:absolute;top:0;left:55px;right:0;height:36px;display:grid;grid-template-columns:50px repeat(16,1fr);align-items:center;background:#18120f;text-align:center;font-size:11px;color:#c7baa6}.string{display:grid;grid-template-columns:55px 50px repeat(16,1fr);height:55px}.sname{display:grid;place-items:center;background:#181411;border-right:4px solid #e5d8bf;font-weight:900}.cell{position:relative;display:grid;place-items:center;border:0;border-right:3px solid #ddd1bd88;background:transparent;cursor:pointer}.cell:before{content:'';position:absolute;left:0;right:0;top:50%;height:var(--sw);background:linear-gradient(#f5ecdf,#736c64);box-shadow:0 2px 2px #0008}.cell.open{border-right:4px solid #e5d8bf;background:#0002}.cell:hover{background:#f2c14e18}.dot{z-index:2;display:grid;place-items:center;width:37px;height:37px;border-radius:50%;background:var(--ivory);color:#211a13;font-size:13px;font-weight:950;opacity:0;transform:scale(.6);transition:.18s}.dot.show,.cell.explored .dot{opacity:1;transform:scale(1)}.dot.root{background:var(--gold);outline:3px solid white}.dot.chord{background:var(--teal);color:white}.dot.changed{background:var(--coral);color:white}.dot.ring{box-shadow:0 0 0 7px #f2c14e44}.help{color:var(--muted);font-size:12px;margin-top:10px}.tools{margin-top:13px;flex-wrap:wrap}.record .timeline,.record .actions,.record .nav{display:none}.record .app{max-width:none}.record .grid{grid-template-columns:330px 1fr}
@media(max-width:950px){.grid{grid-template-columns:1fr}.nav{margin-top:15px}.script-card{padding:18px}h1{font-size:34px}.lab{padding:14px}}
@media(max-width:560px){.app{padding:9px}.top .btn:not(.primary){display:none}.lab-head{display:block}.readout{margin-bottom:10px}.record .grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand"><b>FretLab</b> · Reel Lab</div><div class="actions"><button class="btn" id="clear">Очистить</button><button class="btn primary" id="record">Режим записи</button></div></header>
<nav class="timeline" id="timeline"></nav>
<div class="grid">
<section class="card script-card"><div class="kicker" id="kicker"></div><h1 id="title"></h1><div class="script"><small>Текст озвучки</small><span id="script"></span></div><p class="key" id="key"></p><div class="nav"><button class="btn" id="prev">← Назад</button><button class="btn primary" id="next">Дальше →</button></div></section>
<section class="card lab"><div class="lab-head"><div><h2 id="labTitle"></h2><p id="labSub"></p></div><div class="readout"><span><small>нота</small><b id="rNote">—</b></span><span><small>от C</small><b id="rDist">—</b></span><span><small>ступень</small><b id="rDegree">—</b></span></div></div><div class="concept" id="concept"></div><div class="formula" id="formula"></div><div class="scroll" id="scroll"><div class="board" id="board"></div></div><div class="help"><b>Нажимай на любую позицию:</b> каждая нота звучит. Золото — тоника, коралл — изменённая ступень.</div><div class="tools"><button class="btn active" data-mode="degrees">Ступени</button><button class="btn" data-mode="notes">Ноты</button><button class="btn" id="play">▶ Проиграть показанное</button><button class="btn" id="focus">К активной позиции</button></div></section>
</div></main>
<script>
const N=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'], STR=[['e',64,1.2],['B',59,1.5],['G',55,1.9],['D',50,2.4],['A',45,3],['E',40,3.8]];
const MAJ=[[4,3,'1'],[4,5,'2'],[4,7,'3'],[4,8,'4'],[4,10,'5'],[4,12,'6'],[4,14,'7'],[4,15,'1']];
const POS=[[0,7,'7'],[0,8,'1'],[0,10,'2'],[1,8,'5'],[1,10,'6'],[2,7,'2'],[2,9,'3'],[2,10,'4'],[3,7,'6'],[3,9,'7'],[3,10,'1'],[4,7,'3'],[4,8,'4'],[4,10,'5'],[5,8,'1'],[5,10,'2']];
const CHORD=[[0,8,'1'],[1,8,'5','chord'],[2,9,'3','chord'],[3,10,'1'],[4,7,'3','chord'],[4,10,'5','chord'],[5,8,'1']];
const NEXT=MAJ.map(p=>p[2]==='6'?[p[0],p[1],'A','changed']:p);
const scenes=[
{nav:'Начало',time:'0–4',kick:'Просто о сложном',title:'Как из полутонов получается музыка?',script:'Сейчас разберём, как из двух простых расстояний получаются гамма, аккорд и арпеджио.',key:'Полутона → формула → гамма → ступени → аккорд → арпеджио.',lab:'Вся система на одном грифе',sub:'Каждую точку можно нажать и услышать.',kind:'hook',points:POS,focus:7,concept:[['½ + 1','расстояния'],['1–7','ступени'],['1–3–5','аккорд']]},
{nav:'Расстояние',time:'4–12',kick:'Шаг 1 · единицы измерения',title:'Сначала поймём тоны и полутоны',script:'Расстояние между соседними ладами — один полутон. Два лада — целый тон. Именно этими шагами мы будем двигаться по гамме.',key:'Один лад — полутон. Два лада — тон.',lab:'Расстояние на грифе',sub:'Нажми C, соседний лад и D.',kind:'distance',points:[[4,3,'1'],[4,4,'♯1','changed'],[4,5,'2']],focus:3,concept:[['1 лад','полутон'],['2 лада','тон'],['12 ладов','октава']]},
{nav:'Формула',time:'12–21',kick:'Шаг 2 · рецепт гаммы',title:'Из расстояний складывается формула',script:'Формула мажорной гаммы: тон, тон, полутон, затем три отдельных тона и ещё один полутон.',key:'Каждый знак — расстояние до следующей ноты.',lab:'Формула C major',sub:'Тон · тон · полутон · тон · тон · тон · полутон.',kind:'formula',points:MAJ,focus:3,concept:[['Т–Т–½','начало'],['Т–Т–Т','три шага'],['½','октава']]},
{nav:'На струне',time:'21–30',kick:'Шаг 3 · применяем формулу',title:'Строим C major на одной струне',script:'Начнём от ноты до и пройдём по формуле. Получаем: до, ре, ми, фа, соль, ля, си и снова до.',key:'Формула превращает расстояния в конкретные ноты.',lab:'C major от C до C',sub:'Нажимай точки по порядку или включи воспроизведение.',kind:'line',points:MAJ,focus:3,concept:[['C–D–E','тон + тон'],['E–F','полутон'],['B–C','полутон']]},
{nav:'Позиция',time:'30–39',kick:'Шаг 4 · шесть струн',title:'Та же гамма в удобной позиции',script:'На одной струне гамма выглядит как длинная линия. Те же ноты можно перенести на соседние струны и получить удобную позицию.',key:'Ноты не изменились — изменилась только геометрия.',lab:'C Major · проверенная E-форма',sub:'Кликабельная позиция на ладах 7–10.',kind:'position',points:POS,focus:7,concept:[['те же ноты','C major'],['6 струн','новая раскладка'],['E-форма','позиция']]},
{nav:'Ступени',time:'39–48',kick:'Шаг 5 · даём нотам номера',title:'Эти номера называются ступенями',script:'Теперь пронумеруем ноты от первой до седьмой. Ступень показывает не название ноты, а её место и роль относительно тоники.',key:'Последняя C — снова первая ступень, только на октаву выше.',lab:'Ноты превращаются в ступени',sub:'Переключай подписи «Ступени / Ноты».',kind:'degrees',points:POS,focus:7,concept:[['C–B','названия нот'],['1–7','ступени'],['C','тоника = 1']]},
{nav:'Аккорд',time:'48–58',kick:'Шаг 6 · выбираем 1–3–5',title:'Строим аккорд из ступеней',script:'Чтобы построить основной аккорд гаммы, берём первую, третью и пятую ступени. В до мажоре это до, ми и соль.',key:'1 даёт название, 3 делает аккорд мажорным, 5 добавляет устойчивость.',lab:'Тоны C major внутри гаммы',sub:'Золото — тоника, бирюзовый — третья и пятая.',kind:'chord',points:CHORD,focus:7,concept:[['1 · C','основа'],['3 · E','мажор'],['5 · G','устойчивость']]},
{nav:'Арпеджио',time:'58–67',kick:'Шаг 7 · те же ноты по очереди',title:'Аккорд и арпеджио — одни ноты',script:'Если сыграть до, ми и соль одновременно, получится аккорд. Если сыграть те же ноты по очереди — получится арпеджио.',key:'Нажми «Проиграть показанное» и проследи маршрут по грифу.',lab:'C major arpeggio · E-форма',sub:'Точные тона аккорда внутри позиции гаммы.',kind:'arpeggio',points:CHORD,focus:7,concept:[['C+E+G','вместе'],['C→E→G','по очереди'],['1–3–5','одни тона']]},
{nav:'Продолжение',time:'67–73',kick:'Следующий ролик',title:'Те же ноты — новый центр',script:'Подписывайся. В следующем ролике разберём ля минор и почему он является параллельной тональностью до мажора. Затем перейдём к остальным диатоническим ладам.',key:'C major и A minor содержат одни ноты, но ощущаются по-разному.',lab:'Дальше: C major ↔ A minor',sub:'Тизер следующего шага — новая тоника A.',kind:'next',points:NEXT,focus:3,concept:[['C major','тоника C'],['те же ноты','без изменений'],['A minor','тоника A']]}
];
let idx=0,mode='degrees',ctx,last,playing=false;const $=id=>document.getElementById(id),pc=m=>((m%12)+12)%12;
function makeBoard(){let nums='<div class="nums"><i>струна</i>'+Array.from({length:17},(_,f)=>`<i>${f}</i>`).join('')+'</div>';let rows=STR.map(([name,midi,w],s)=>`<div class="string"><span class="sname">${name}</span>`+Array.from({length:17},(_,f)=>`<button class="cell ${f?'':'open'}" style="--sw:${w}px" data-s="${s}" data-f="${f}" data-midi="${midi+f}"><span class="dot">${N[pc(midi+f)]}</span></button>`).join('')+'</div>').join('');$('board').innerHTML=nums+rows}
function makeTimeline(){$('timeline').innerHTML=scenes.map((s,i)=>`<button class="tab" data-i="${i}"><b>${i+1}. ${s.nav}</b><small>${s.time} сек.</small></button>`).join('')}
function formula(s){if(!['formula','line'].includes(s.kind))return '';let notes=['C','D','E','F','G','A','B','C'],steps=['тон','тон','½','тон','тон','тон','½'];return notes.map((n,i)=>`<div class="f-note"><button class="${i==0||i==7?'root':''}" data-fi="${i}">${mode==='degrees'?s.points[i][2]:n}</button><small>${n}</small></div>${i<7?`<div class="step">${steps[i]}</div>`:''}`).join('')}
function clear(){document.querySelectorAll('.cell').forEach(c=>{c.classList.remove('explored');let d=c.querySelector('.dot');d.className='dot';d.textContent=N[pc(+c.dataset.midi)]});last=null}
function paint(){let s=scenes[idx];clear();s.points.forEach(([st,f,d,state])=>{let c=document.querySelector(`[data-s="${st}"][data-f="${f}"]`),x=c.querySelector('.dot');x.classList.add('show');if(d==='1')x.classList.add('root');if(state==='chord')x.classList.add('chord');if(state==='changed')x.classList.add('changed');x.textContent=mode==='degrees'?d:N[pc(+c.dataset.midi)]});$('kicker').textContent=s.kick;$('title').textContent=s.title;$('script').textContent=s.script;$('key').textContent=s.key;$('labTitle').textContent=s.lab;$('labSub').textContent=s.sub;$('concept').innerHTML=s.concept.map(x=>`<div><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('');$('formula').innerHTML=formula(s);[...$('timeline').children].forEach((b,i)=>b.classList.toggle('active',i===idx));$('prev').disabled=idx===0;$('next').textContent=idx===scenes.length-1?'Сначала ↺':'Дальше →';read();setTimeout(focus,30)}
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function sound(m,delay=0){let c=audio(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type='triangle';o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.2,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.65);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.7)}
function degree(m){return ({0:'1',2:'2',4:'3',5:'4',7:'5',9:'6',11:'7'})[pc(m)]||'—'}
function read(c){$('rNote').textContent=c?N[pc(+c.dataset.midi)]:'—';$('rDist').textContent=c?pc(+c.dataset.midi)+' пт.':'—';$('rDegree').textContent=c?degree(+c.dataset.midi):'—'}
function activate(c,play=true){if(last)last.querySelector('.dot').classList.remove('ring');c.classList.add('explored');c.querySelector('.dot').classList.add('ring');last=c;read(c);if(play)sound(+c.dataset.midi)}
function focus(){let f=scenes[idx].focus,c=document.querySelector(`[data-s="0"][data-f="${f}"]`);$('scroll').scrollTo({left:Math.max(0,c.offsetLeft-$('scroll').clientWidth*.25),behavior:'smooth'})}
async function play(){if(playing)return;playing=true;let cells=scenes[idx].points.map(p=>document.querySelector(`[data-s="${p[0]}"][data-f="${p[1]}"]`)),u=[...new Map(cells.map(c=>[+c.dataset.midi,c])).entries()].sort((a,b)=>a[0]-b[0]);u.forEach(([m],i)=>sound(m,i*.33));for(let [,c] of u){activate(c,false);await new Promise(r=>setTimeout(r,330))}playing=false}
function go(n){idx=(n+scenes.length)%scenes.length;paint()}makeBoard();makeTimeline();paint();
$('timeline').onclick=e=>{let b=e.target.closest('[data-i]');if(b)go(+b.dataset.i)};$('board').onclick=e=>{let c=e.target.closest('.cell');if(c)activate(c)};$('formula').onclick=e=>{let b=e.target.closest('[data-fi]');if(!b)return;let p=scenes[idx].points[+b.dataset.fi],c=document.querySelector(`[data-s="${p[0]}"][data-f="${p[1]}"]`);activate(c);focus()};$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx===scenes.length-1?0:idx+1);$('clear').onclick=paint;$('focus').onclick=focus;$('play').onclick=play;$('record').onclick=()=>document.body.classList.toggle('record');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));paint()});onkeydown=e=>{if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1);if(e.key==='Escape')document.body.classList.remove('record')};
</script></body></html>
